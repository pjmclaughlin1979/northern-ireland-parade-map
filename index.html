<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#10191e" />
  <meta name="description" content="Explore the latest upcoming parades across Northern Ireland on an interactive map." />
  <title>Upcoming Parades | Northern Ireland</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://js.arcgis.com/5.1/esri/themes/dark/main.css" />
  <script type="module" src="https://js.arcgis.com/5.1/"></script>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f7f5;
      --muted: #a8b5b1;
      --subtle: #71817d;
      --accent: #98e2bf;
      --accent-strong: #5fc596;
      --panel: rgba(19, 31, 35, .82);
      --panel-border: rgba(232, 248, 241, .13);
      --surface: rgba(255, 255, 255, .055);
      --font: "DM Sans", system-ui, sans-serif;
      --display: "Manrope", "DM Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body, #root { width: 100%; height: 100%; margin: 0; }
    body { background: #10191e; color: var(--ink); font-family: var(--font); }
    button, input { font: inherit; }
    button { color: inherit; }
    .app { position: relative; width: 100%; height: 100%; overflow: hidden; }
    .map { position: absolute; inset: 0; }
    .map .esri-view-surface:focus::after { outline: none !important; }
    .map .esri-attribution { color: #e6eeeb; }
    .esri-ui-top-right { top: 78px; }
    .esri-ui-bottom-right { bottom: 18px; }
    .panel {
      position: absolute;
      z-index: 2;
      top: 22px;
      bottom: 22px;
      left: 22px;
      display: flex;
      flex-direction: column;
      width: min(410px, calc(100vw - 44px));
      overflow: hidden;
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .34), inset 0 1px rgba(255, 255, 255, .045);
      backdrop-filter: blur(24px) saturate(135%);
      -webkit-backdrop-filter: blur(24px) saturate(135%);
    }
    .panel-head { padding: 25px 25px 18px; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; color: var(--accent); font-size: 11px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
    .brand-mark { display: grid; width: 31px; height: 31px; place-items: center; border: 1px solid rgba(152, 226, 191, .38); border-radius: 10px; background: rgba(152, 226, 191, .11); }
    .brand-mark svg { width: 17px; height: 17px; }
    .updated { color: var(--subtle); font-size: 11px; white-space: nowrap; }
    h1 { margin: 23px 0 8px; font: 800 27px/1.12 var(--display); letter-spacing: -.045em; }
    .intro { max-width: 315px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 19px; }
    .stat { padding: 13px 14px; border: 1px solid rgba(255, 255, 255, .07); border-radius: 14px; background: var(--surface); }
    .stat strong { display: block; font: 700 20px/1 var(--display); letter-spacing: -.04em; }
    .stat span { display: block; margin-top: 6px; color: var(--muted); font-size: 11px; }
    .controls { display: grid; gap: 11px; padding: 0 25px 16px; }
    .search { position: relative; }
    .search svg { position: absolute; top: 12px; left: 13px; width: 17px; height: 17px; color: var(--subtle); pointer-events: none; }
    .search input { width: 100%; height: 42px; padding: 0 14px 0 40px; border: 1px solid rgba(255, 255, 255, .1); border-radius: 12px; outline: none; background: rgba(0, 0, 0, .16); color: var(--ink); font-size: 12px; }
    .search input::placeholder { color: #81908c; }
    .search input:focus { border-color: rgba(152, 226, 191, .65); box-shadow: 0 0 0 3px rgba(152, 226, 191, .1); }
    .filter-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .filter-tabs { display: flex; gap: 5px; padding: 4px; border: 1px solid rgba(255, 255, 255, .07); border-radius: 11px; background: rgba(0, 0, 0, .13); }
    .filter-tabs button { padding: 7px 10px; border: 0; border-radius: 8px; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 600; transition: .18s ease; }
    .filter-tabs button.active { background: rgba(152, 226, 191, .14); color: var(--accent); }
    .refresh { display: inline-flex; align-items: center; gap: 6px; padding: 8px 9px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); cursor: pointer; font-size: 11px; }
    .refresh:hover { background: var(--surface); color: var(--ink); }
    .refresh svg { width: 14px; height: 14px; }
    .flag-filter { display: inline-flex; align-items: center; gap: 8px; justify-self: start; margin-top: -7px; padding: 7px 10px; border: 1px solid rgba(255, 255, 255, .09); border-radius: 999px; background: rgba(255, 255, 255, .025); color: var(--muted); cursor: pointer; font-size: 11px; }
    .flag-filter::before { width: 7px; height: 7px; border-radius: 50%; background: #f2a07f; content: ""; }
    .flag-filter.active { border-color: rgba(152, 226, 191, .3); background: rgba(152, 226, 191, .1); color: var(--accent); }
    .flag-filter.active::before { background: var(--accent); box-shadow: 0 0 8px rgba(152, 226, 191, .5); }
    .list-meta { display: flex; align-items: center; justify-content: space-between; padding: 0 25px 9px; color: var(--subtle); font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .parade-list { min-height: 0; flex: 1; overflow: auto; padding: 0 15px 12px; scrollbar-color: rgba(255, 255, 255, .18) transparent; scrollbar-width: thin; }
    .parade-card { position: relative; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 13px; width: 100%; margin: 0 0 8px; padding: 13px; border: 1px solid transparent; border-radius: 15px; background: rgba(255, 255, 255, .035); color: inherit; text-align: left; cursor: pointer; transition: background .18s ease, border-color .18s ease, transform .18s ease; }
    .parade-card:hover { transform: translateY(-1px); border-color: rgba(255, 255, 255, .11); background: rgba(255, 255, 255, .075); }
    .parade-card.selected { border-color: rgba(152, 226, 191, .34); background: rgba(152, 226, 191, .085); }
    .date-tile { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 46px; height: 51px; border-radius: 12px; background: rgba(152, 226, 191, .12); color: var(--accent); }
    .date-tile strong { font: 800 18px/1 var(--display); }
    .date-tile span { margin-top: 4px; font-size: 9px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
    .card-copy { min-width: 0; padding-top: 1px; }
    .card-title { display: block; overflow: hidden; font: 700 13px/1.35 var(--display); text-overflow: ellipsis; white-space: nowrap; }
    .card-location { display: flex; align-items: center; gap: 4px; margin-top: 6px; color: var(--muted); font-size: 11px; }
    .card-location svg { flex: 0 0 auto; width: 12px; height: 12px; color: var(--accent); }
    .card-bottom { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .time { color: #d4ded9; font-size: 10px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .badge { padding: 3px 6px; border-radius: 6px; background: rgba(236, 158, 126, .13); color: #f2b193; font-size: 9px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .no-pin { margin-left: auto; color: #82908b; font-size: 9px; }
    .empty { padding: 36px 22px; color: var(--muted); text-align: center; font-size: 13px; line-height: 1.5; }
    .detail { margin: 0 15px 13px; padding: 15px; border: 1px solid rgba(152, 226, 191, .19); border-radius: 16px; background: rgba(152, 226, 191, .075); }
    .detail-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .detail h2 { margin: 0; font: 700 14px/1.35 var(--display); }
    .detail-close { display: grid; width: 25px; height: 25px; flex: 0 0 auto; place-items: center; border: 0; border-radius: 7px; background: rgba(255, 255, 255, .07); color: var(--muted); cursor: pointer; }
    .detail-date { margin-top: 6px; color: var(--accent); font-size: 11px; font-weight: 600; }
    .detail-location { display: flex; align-items: center; gap: 5px; margin-top: 8px; color: var(--muted); font-size: 11px; }
    .detail-location svg { width: 13px; height: 13px; color: var(--accent); }
    .detail-route { max-height: 56px; overflow: auto; margin: 11px 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
    .route-match { margin-top: 8px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .source-link { color: var(--accent); font-size: 11px; font-weight: 600; text-decoration: none; }
    .source-link:hover { text-decoration: underline; }
    .panel-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 20px; border-top: 1px solid rgba(255, 255, 255, .08); color: var(--subtle); font-size: 9px; }
    .panel-foot a { color: var(--muted); text-decoration: none; }
    .panel-foot a:hover { color: var(--accent); }
    .status { position: absolute; z-index: 1; top: 22px; right: 22px; display: flex; align-items: center; gap: 8px; padding: 10px 13px; border: 1px solid rgba(255, 255, 255, .12); border-radius: 13px; background: rgba(19, 31, 35, .72); color: var(--muted); font-size: 11px; backdrop-filter: blur(14px); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-strong); box-shadow: 0 0 12px rgba(95, 197, 150, .55); }
    .status.error { color: #f2b193; }
    .status.error .status-dot { background: #f2a07f; }
    .load-error { margin: 0 25px 15px; padding: 11px 12px; border: 1px solid rgba(242, 161, 127, .25); border-radius: 11px; background: rgba(242, 161, 127, .08); color: #f2b193; font-size: 11px; line-height: 1.45; }
    .loader { display: grid; height: 100%; place-items: center; color: var(--muted); font-size: 12px; }
    .loader span { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border: 1px solid var(--panel-border); border-radius: 13px; background: var(--panel); backdrop-filter: blur(14px); }
    .spinner { width: 14px; height: 14px; border: 2px solid rgba(152, 226, 191, .2); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (max-width: 700px) {
      .panel { top: auto; right: 10px; bottom: 10px; left: 10px; width: auto; max-height: min(69vh, 660px); border-radius: 21px; }
      .panel-head { padding: 17px 18px 13px; }
      h1 { margin-top: 14px; font-size: 23px; }
      .intro { font-size: 12px; }
      .summary { margin-top: 12px; }
      .stat { padding: 10px 12px; }
      .controls { gap: 8px; padding: 0 18px 12px; }
      .list-meta { padding: 0 18px 7px; }
      .parade-list { padding: 0 10px 10px; }
      .panel-foot { padding: 9px 15px; }
      .status { top: 10px; right: 10px; }
      .esri-ui-top-right { top: 65px; }
      .esri-ui-bottom-right { bottom: 10px; }
      .detail { margin: 0 10px 9px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19.2.0",
        "react-dom/client": "https://esm.sh/react-dom@19.2.0/client"
      }
    }
  </script>
</head>
<body>
  <div id="root"><div class="loader"><span><i class="spinner"></i> Loading parade map</span></div></div>
  <script type="module">
    import React, { useEffect, useMemo, useRef, useState } from "react";
    import { createRoot } from "react-dom/client";

    const { createElement: h } = React;
    const Icon = ({ children, ...props }) => h("svg", { viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 1.8, strokeLinecap: "round", strokeLinejoin: "round", "aria-hidden": true, ...props }, children);
    const pinIcon = h(Icon, null, h("path", { d: "M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z" }), h("circle", { cx: 12, cy: 10, r: 2.5 }));
    const searchIcon = h(Icon, null, h("circle", { cx: 11, cy: 11, r: 7 }), h("path", { d: "m20 20-4-4" }));
    const refreshIcon = h(Icon, null, h("path", { d: "M20 7v5h-5" }), h("path", { d: "M19 12a7 7 0 0 0-12-5L5 9" }), h("path", { d: "M4 17v-5h5" }), h("path", { d: "M5 12a7 7 0 0 0 12 5l2-2" }));
    const brandIcon = h(Icon, null, h("path", { d: "M12 22s7-7.2 7-13a7 7 0 1 0-14 0c0 5.8 7 13 7 13Z" }), h("circle", { cx: 12, cy: 9, r: 2 }));
    let graphicsModules;

    const formatDate = (value, options) => new Intl.DateTimeFormat("en-GB", options).format(new Date(`${value}T12:00:00`));
    const timeRange = parade => [parade.startTime, parade.endTime].filter(Boolean).join("–");
    let nominatimQueue = Promise.resolve();
    let lastNominatimRequest = 0;
    const allUpcoming = parades => {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return parades.filter(parade => new Date(`${parade.date}T12:00:00`) >= today);
    };

    function App() {
      const [feed, setFeed] = useState(null);
      const [loadError, setLoadError] = useState("");
      const [search, setSearch] = useState("");
      const [timeFilter, setTimeFilter] = useState("all");
      const [contentiousOnly, setContentiousOnly] = useState(false);
      const [selected, setSelected] = useState(null);
      const [mapReady, setMapReady] = useState(false);
      const [routeStatus, setRouteStatus] = useState(null);
      const mapNode = useRef(null);
      const viewRef = useRef(null);
      const markerLayerRef = useRef(null);
      const routeLayerRef = useRef(null);
      const routeCacheRef = useRef(new Map());
      const selectedRef = useRef(null);

      useEffect(() => {
        let cancelled = false;
        fetch("data/parades.json", { cache: "no-cache" })
          .then(response => {
            if (!response.ok) throw new Error(`Parade data request failed (${response.status})`);
            return response.json();
          })
          .then(data => {
            if (!Array.isArray(data.parades)) throw new Error("The parade data file has an invalid format");
            if (!cancelled) setFeed(data);
          })
          .catch(error => {
            if (!cancelled) setLoadError(error.message || "Parade data could not be loaded.");
          });
        return () => { cancelled = true; };
      }, []);

      useEffect(() => {
        let view;
        let clickHandle;
        let cancelled = false;
        (async () => {
          try {
            const [Map, MapView, GraphicsLayer, Graphic, Point, Polyline, Zoom, Compass] = await $arcgis.import([
              "@arcgis/core/Map.js",
              "@arcgis/core/views/MapView.js",
              "@arcgis/core/layers/GraphicsLayer.js",
              "@arcgis/core/Graphic.js",
              "@arcgis/core/geometry/Point.js",
              "@arcgis/core/geometry/Polyline.js",
              "@arcgis/core/widgets/Zoom.js",
              "@arcgis/core/widgets/Compass.js"
            ]);
            graphicsModules = [Graphic, Point, Polyline];
            if (cancelled || !mapNode.current) return;
            const routeLayer = new GraphicsLayer({ title: "Parade routes (matched to OpenStreetMap)" });
            const markerLayer = new GraphicsLayer({ title: "Upcoming parades" });
            const map = new Map({ basemap: "dark-gray-vector", layers: [routeLayer, markerLayer] });
            view = new MapView({
              container: mapNode.current,
              map,
              center: [-6.65, 54.62],
              zoom: 8,
              constraints: { minZoom: 6, maxZoom: 16 },
              popupEnabled: false,
              ui: { components: [] }
            });
            viewRef.current = view;
            markerLayerRef.current = markerLayer;
            routeLayerRef.current = routeLayer;
            await view.when();
            if (cancelled) return;
            view.ui.add(new Zoom({ view }), "top-right");
            view.ui.add(new Compass({ view }), "top-right");
            clickHandle = view.on("click", async event => {
              const result = await view.hitTest(event, { include: [markerLayer] });
              const graphic = result.results.find(hit => hit.graphic?.attributes?.paradeId)?.graphic;
              if (graphic) {
                const parade = selectedRef.current?.parades.find(item => item.id === graphic.attributes.paradeId);
                if (parade) setSelected(parade);
              }
            });
            setMapReady(true);
          } catch (error) {
            view?.destroy();
            viewRef.current = null;
            markerLayerRef.current = null;
            routeLayerRef.current = null;
            if (!cancelled) setLoadError(error.message || "The map could not be initialized.");
          }
        })();
        return () => {
          cancelled = true;
          clickHandle?.remove();
          view?.destroy();
          viewRef.current = null;
          markerLayerRef.current = null;
          routeLayerRef.current = null;
        };
      }, []);

      const upcoming = useMemo(() => allUpcoming(feed?.parades || []).sort((a, b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime)), [feed]);
      const visible = useMemo(() => {
        const query = search.trim().toLocaleLowerCase();
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const week = new Date(today);
        week.setDate(week.getDate() + 7);
        return upcoming.filter(parade => {
          const date = new Date(`${parade.date}T12:00:00`);
          const matchesTime = timeFilter === "all" || date <= week;
          const matchesSearch = !query || [parade.title, parade.location, parade.route].some(value => value?.toLocaleLowerCase().includes(query));
          return matchesTime && matchesSearch && (!contentiousOnly || parade.contentious);
        });
      }, [upcoming, search, timeFilter, contentiousOnly]);
      const locatedCount = upcoming.filter(parade => parade.coordinates).length;
      const unlocatedCount = upcoming.length - locatedCount;

      useEffect(() => {
        selectedRef.current = { parades: feed?.parades || [] };
      }, [feed]);

      useEffect(() => {
        const layer = markerLayerRef.current;
        const [Graphic, Point] = graphicsModules || [];
        if (!layer || !Graphic || !Point) return;
        layer.removeAll();
        layer.addMany(visible.filter(parade => parade.coordinates).map(parade => new Graphic({
          geometry: new Point({ longitude: parade.coordinates.longitude, latitude: parade.coordinates.latitude }),
          attributes: { paradeId: parade.id },
          symbol: {
            type: "simple-marker",
            style: "circle",
            color: parade.contentious ? [237, 145, 117, .95] : [125, 220, 177, .94],
            size: 12,
            outline: { color: [12, 26, 29, .92], width: 2 }
          }
        })));
      }, [visible, mapReady]);

      useEffect(() => {
        const view = viewRef.current;
        const layer = routeLayerRef.current;
        const [Graphic, Point, Polyline] = graphicsModules || [];
        if (!view || !layer || !Graphic || !Polyline || !feed) return;

        let active = true;
        let timer;
        const renderRoutes = async () => {
          layer.removeAll();
          const selectedOnly = selected ? [selected] : null;
          const candidates = selectedOnly || (view.zoom >= 12
            ? visible.filter(parade => parade.coordinates && view.extent?.contains(new Point({
              longitude: parade.coordinates.longitude,
              latitude: parade.coordinates.latitude,
              spatialReference: { wkid: 4326 }
            })))
            : []);
          layer.visible = Boolean(selected || view.zoom >= 12);
          if (selected && !routeStreetNames(selected).length) {
            setRouteStatus({ id: selected.id, state: "ready", matched: 0, total: 0 });
            return;
          }
          if (!candidates.length) {
            if (selected) setRouteStatus({ id: selected.id, state: "empty", matched: 0, total: routeStreetNames(selected).length });
            return;
          }

          const byLocation = new Map();
          for (const parade of candidates) {
            if (!parade.coordinates || !parade.location) continue;
            const key = parade.location.toLocaleLowerCase();
            if (!byLocation.has(key)) byLocation.set(key, { center: parade.coordinates, parades: [] });
            byLocation.get(key).parades.push(parade);
          }
          const places = [...byLocation.entries()].slice(0, selected ? 1 : 6);
          if (selected) setRouteStatus({ id: selected.id, state: "loading", matched: 0, total: routeStreetNames(selected).length });

          for (const [key, place] of places) {
            try {
              if (!place.parades.some(parade => routeStreetNames(parade).length)) continue;
              for (const parade of place.parades) {
                const names = routeStreetNames(parade);
                let matchingWays;
                if (selected?.id === parade.id) {
                  matchingWays = [];
                  const matchedNames = new Set();
                  for (const [index, name] of names.entries()) {
                    if (!active) return;
                    const matches = await loadNominatimStreet(name, parade.location, routeCacheRef.current);
                    matchingWays.push(...matches);
                    if (matches.length) matchedNames.add(normalizeStreet(name));
                    setRouteStatus({
                      id: parade.id,
                      state: "loading",
                      matched: matchedNames.size,
                      checked: index + 1,
                      total: names.length
                    });
                  }
                  if (!active) return;
                  setRouteStatus({ id: parade.id, state: "ready", matched: matchedNames.size, total: names.length });
                } else {
                  const ways = await loadOsmWays(key, place.center, routeCacheRef.current);
                  if (!active) return;
                  const nameSet = new Set(names.map(normalizeStreet));
                  matchingWays = ways.filter(way => nameSet.has(normalizeStreet(way.name)));
                }
                if (selected?.id === parade.id) {
                  layer.removeAll();
                }
                for (const way of matchingWays) {
                  layer.add(new Graphic({
                    geometry: new Polyline({
                      paths: [way.geometry.map(point => [point.lon, point.lat])],
                      spatialReference: { wkid: 4326 }
                    }),
                    attributes: { paradeId: parade.id, streetName: way.name },
                    symbol: {
                      type: "simple-line",
                      color: selected?.id === parade.id ? [143, 237, 192, 0.88] : [143, 237, 192, 0.42],
                      width: selected?.id === parade.id ? 3.5 : 2.5,
                      style: "solid"
                    }
                  }));
                }
              }
            } catch (error) {
              if (selected && place.parades.some(parade => parade.id === selected.id)) {
                setRouteStatus({ id: selected.id, state: "error", message: error.message });
              } else {
                setLoadError(`Nearby OpenStreetMap streets could not be loaded: ${error.message}`);
              }
            }
          }
        };

        const scheduleRender = () => {
          clearTimeout(timer);
          timer = setTimeout(() => { renderRoutes(); }, selected ? 0 : 450);
        };
        const zoomHandle = view.watch("zoom", scheduleRender);
        const extentHandle = view.watch("extent", scheduleRender);
        renderRoutes();
        return () => {
          active = false;
          clearTimeout(timer);
          zoomHandle.remove();
          extentHandle.remove();
        };
      }, [feed, visible, selected, mapReady]);

      const goToParade = parade => {
        setSelected(parade);
        if (parade.coordinates && viewRef.current) {
          viewRef.current.goTo({ center: [parade.coordinates.longitude, parade.coordinates.latitude], zoom: Math.max(viewRef.current.zoom, 11) }, { duration: 650 })
            .catch(error => {
              if (error.name !== "AbortError") setLoadError(error.message || "The selected location could not be shown.");
            });
        }
      };

      function normalizeStreet(value) {
        return (value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase()
          .replace(/[^\p{L}\p{N}]+/gu, " ").trim();
      }

      function routeStreetNames(parade) {
        return [...new Set((`${parade.route || ""},${parade.returnRoute || ""}`)
          .split(",")
          .map(name => name.trim())
          .filter(name => name && !/^(stopping\b|rally\b)/i.test(name))
          .map(name => name.replace(/^RTD\s+/i, "").trim())
          .filter(name => name && !/^(stopping\b|rally\b)/i.test(name)))];
      }

      async function loadOsmWays(location, center, cache) {
        if (cache.has(location)) return cache.get(location);
        const query = `[out:json][timeout:12];way(around:3000,${center.latitude},${center.longitude})[highway][name];out geom;`;
        const request = fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`, {
          signal: AbortSignal.timeout(15000),
          headers: { Accept: "application/json" }
        }).then(async response => {
          if (!response.ok) throw new Error(`OpenStreetMap street lookup failed (${response.status})`);
          const data = await response.json();
          if (!Array.isArray(data.elements)) throw new Error("OpenStreetMap returned an invalid street response");
          return data.elements.filter(way => way.tags?.name && way.geometry?.length > 1);
        }).catch(error => {
          cache.delete(location);
          throw error;
        });
        cache.set(location, request);
        return request;
      }

      async function loadNominatimStreet(street, location, cache) {
        const key = `nominatim:${location.toLocaleLowerCase()}:${normalizeStreet(street)}`;
        if (cache.has(key)) return cache.get(key);
        const request = nominatimQueue.then(async () => {
          const wait = Math.max(0, 1100 - (Date.now() - lastNominatimRequest));
          if (wait) await new Promise(resolve => setTimeout(resolve, wait));
          lastNominatimRequest = Date.now();
          const params = new URLSearchParams({
            format: "jsonv2",
            polygon_geojson: "1",
            limit: "8",
            q: `${street}, ${location}, Northern Ireland`
          });
          const response = await fetch(`https://nominatim.openstreetmap.org/search?${params}`, {
            signal: AbortSignal.timeout(15000),
            headers: { Accept: "application/json" }
          });
          if (!response.ok) throw new Error(`OpenStreetMap street search failed (${response.status})`);
          const results = await response.json();
          if (!Array.isArray(results)) throw new Error("OpenStreetMap returned an invalid street search response");
          return results.filter(result => result.osm_type === "way"
            && result.geojson?.type === "LineString"
            && result.geojson.coordinates.length > 1
            && normalizeStreet(result.name || result.address?.road) === normalizeStreet(street))
            .map(result => ({
              name: result.name || street,
              geometry: result.geojson.coordinates.map(([lon, lat]) => ({ lon, lat }))
            }));
        });
        nominatimQueue = request.catch(() => {});
        cache.set(key, request);
        request.catch(() => cache.delete(key));
        return request;
      }

      return h("main", { className: "app" },
        h("div", { ref: mapNode, className: "map", "aria-label": "Map of upcoming parades in Northern Ireland" }),
        h("div", { className: `status${loadError ? " error" : ""}` },
          h("span", { className: "status-dot" }),
          loadError && !mapReady ? "Map unavailable" : mapReady ? `${locatedCount.toLocaleString("en-GB")} mapped` : "Connecting to map"
        ),
        h("aside", { className: "panel", "aria-label": "Parade information" },
          h("header", { className: "panel-head" },
            h("div", { className: "topline" },
              h("div", { className: "brand" }, h("span", { className: "brand-mark" }, brandIcon), "Northern Ireland"),
              h("span", { className: "updated" }, feed?.fetchedAt ? `Updated ${formatDate(feed.fetchedAt.slice(0, 10), { day: "numeric", month: "short" })}` : "Live feed")
            ),
            h("h1", null, "Parades, on the map."),
            h("p", { className: "intro" }, "Explore upcoming parades and processions across Northern Ireland."),
            h("div", { className: "summary" },
              h("div", { className: "stat" }, h("strong", null, upcoming.length.toLocaleString("en-GB")), h("span", null, "upcoming events")),
              h("div", { className: "stat" }, h("strong", null, locatedCount.toLocaleString("en-GB")), h("span", null, unlocatedCount ? `${unlocatedCount} locations unpinned` : "locations mapped"))
            )
          ),
          h("div", { className: "controls" },
            h("label", { className: "search" },
              searchIcon,
              h("input", { type: "search", placeholder: "Search parade or town", value: search, onChange: event => setSearch(event.target.value), "aria-label": "Search parades or towns" })
            ),
            h("div", { className: "filter-row" },
              h("div", { className: "filter-tabs", role: "group", "aria-label": "Date filter" },
                h("button", { className: timeFilter === "all" ? "active" : "", onClick: () => setTimeFilter("all"), "aria-pressed": timeFilter === "all" }, "All upcoming"),
                h("button", { className: timeFilter === "week" ? "active" : "", onClick: () => setTimeFilter("week"), "aria-pressed": timeFilter === "week" }, "Next 7 days")
              ),
              h("button", { className: "refresh", onClick: () => location.reload(), title: "Reload the latest published data" }, refreshIcon, "Refresh")
            ),
            h("button", {
              className: `flag-filter${contentiousOnly ? " active" : ""}`,
              onClick: () => setContentiousOnly(value => !value),
              "aria-pressed": contentiousOnly
            }, "Contentious parades")
          ),
          h("div", { className: "list-meta" }, h("span", null, "Upcoming events"), h("span", null, `${visible.length} shown`)),
          loadError && h("div", { className: "load-error", role: "alert" }, `Some map data may be unavailable: ${loadError}`),
          !feed && !loadError
            ? h("div", { className: "loader" }, h("span", null, h("i", { className: "spinner" }), "Loading parade data"))
            : visible.length
              ? h("div", { className: "parade-list", role: "list" }, visible.map(parade => {
                return h("button", {
                  key: parade.id,
                  className: `parade-card${selected?.id === parade.id ? " selected" : ""}`,
                  onClick: () => goToParade(parade),
                  role: "listitem",
                  "aria-pressed": selected?.id === parade.id
                },
                  h("span", { className: "date-tile" }, h("strong", null, formatDate(parade.date, { day: "numeric" })), h("span", null, formatDate(parade.date, { month: "short" }))),
                  h("span", { className: "card-copy" },
                    h("span", { className: "card-title" }, parade.title),
                    h("span", { className: "card-location" }, pinIcon, parade.location || "Location not provided"),
                    h("span", { className: "card-bottom" },
                      h("span", { className: "time" }, timeRange(parade) || "Time not listed"),
                      parade.contentious && h("span", { className: "badge" }, "Contentious"),
                      !parade.coordinates && h("span", { className: "no-pin" }, "No map pin")
                    )
                  )
                );
              }))
              : h("div", { className: "empty" }, "No upcoming parades match your search. Try another town or clear the filters."),
          selected && h("section", { className: "detail", "aria-live": "polite" },
            h("div", { className: "detail-top" },
              h("div", null,
                h("h2", null, selected.title),
                h("div", { className: "detail-date" }, `${formatDate(selected.date, { weekday: "long", day: "numeric", month: "long" })}${timeRange(selected) ? ` · ${timeRange(selected)}` : ""}`),
                selected.location && h("div", { className: "detail-location" }, pinIcon, selected.location)
              ),
              h("button", { className: "detail-close", onClick: () => setSelected(null), "aria-label": "Close parade details" }, "×")
            ),
            selected.route && h("p", { className: "detail-route" }, h("strong", null, "Outward route: "), selected.route),
            selected.returnRoute && h("p", { className: "detail-route" }, h("strong", null, "Return route: "), selected.returnRoute),
            routeStatus?.id === selected.id && h("div", { className: "route-match", "aria-live": "polite" },
              routeStatus.state === "loading" ? `Checking street names against OpenStreetMap (${routeStatus.checked || 0}/${routeStatus.total})…` :
                routeStatus.state === "error" ? `Street matching unavailable: ${routeStatus.message}` :
                  `${routeStatus.matched} of ${routeStatus.total} route street names matched in OpenStreetMap. The highlighted lines are indicative, not an official route.`
            ),
            selected.link && h("a", { className: "source-link", href: selected.link, target: "_blank", rel: "noopener noreferrer" }, "Parades Commission details ↗")
          ),
          h("footer", { className: "panel-foot" },
            h("a", { href: "https://www.paradescommission.org/Home.aspx?rss=UpcomingParades", target: "_blank", rel: "noopener noreferrer" }, "Source: Parades Commission"),
            h("span", null, h("a", { href: "https://www.openstreetmap.org/copyright", target: "_blank", rel: "noopener noreferrer" }, "OpenStreetMap roads"), " · Geocoding: ", h("a", { href: "https://github.com/komoot/photon", target: "_blank", rel: "noopener noreferrer" }, "Photon")),
            h("a", { href: "https://github.com/pjmclaughlin1979/cq3" }, "Project source")
          )
        )
      );
    }

    createRoot(document.getElementById("root")).render(h(App));
  </script>
</body>
</html>
